<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a Password - FinTrack</title>
  <link rel="stylesheet" href="user.css">
  <script src="../api.js"></script>
  <script src="../fintrack-core.js"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-brand"><div class="login-brand-inner"><div class="brand"><span class="brand-mark">₹</span><span>FinTrack</span></div><h1>Secure your account</h1><p>Choose a new password before opening your member dashboard.</p></div></section>
    <section class="login-card-wrap"><div class="login-card">
      <div class="eyebrow">First sign in</div><h2>Change your password</h2>
      <p class="sub">Your manager sent you a temporary password. Replace it with a password only you know.</p>
      <form id="firstPasswordForm">
        <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <p id="passwordMessage" class="message" role="status"></p>
        <button id="savePassword" class="btn" style="width:100%" type="submit">Save password and continue</button>
      </form>
      <p style="margin-top:18px;font-size:13px"><button class="btn" type="button" onclick="logoutFintrack()">Sign out</button></p>
    </div></section>
  </main>
  <script src="user-change-password.js"></script>
</body>
</html>
