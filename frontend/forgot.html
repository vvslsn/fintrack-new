<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password - FinTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-brand"><div class="brand-content"><h1>Finance</h1></div></section>
    <section class="login-section"><div class="login-card">
      <div class="login-header"><h2>Reset Password</h2><p>We’ll email a one-time code to your registered address.</p></div>
      <form id="forgotPasswordForm">
        <div class="form-group"><label for="resetEmail">Registered email</label><input id="resetEmail" type="email" autocomplete="email" required placeholder="Enter your account email"></div>
        <button id="sendOtpButton" class="login-btn" type="submit">Email me a reset code</button>
      </form>
      <form id="resetPasswordForm" hidden>
        <div class="form-group"><label for="resetOtp">Six-digit code</label><input id="resetOtp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="Enter the code from your email"></div>
        <div class="form-group"><label for="resetPassword">New password</label><input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
        <div class="form-group"><label for="resetConfirmPassword">Confirm new password</label><input id="resetConfirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter your password"></div>
        <button id="resetSubmit" class="login-btn" type="submit">Reset password</button>
      </form>
      <p id="forgotPasswordMessage" class="login-message" role="status"></p>
      <div class="new-user"><p><a href="admin-login.html">Manager Login</a> · <a href="user/user-login.html">Member Login</a></p></div>
    </div></section>
  </main>
  <script src="api.js"></script>
  <script src="forgot.js"></script>
  <script src="frontend-security.js"></script>
</body>
</html>
