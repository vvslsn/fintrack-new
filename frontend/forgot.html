
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinTrack - Forgot Password</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="login-page">


        <!-- =================================================
             LEFT SIDE - BRAND
             ================================================= -->

        <section class="login-brand">

            <div class="brand-content">

                <h1>
                    Finance
                </h1>

            </div>

        </section>



        <!-- =================================================
             RIGHT SIDE - FORGOT PASSWORD
             ================================================= -->

        <section class="login-section">

            <div class="login-card">


                <!-- =================================================
                     HEADER
                     ================================================= -->

                <div class="login-header">

                    <h2>
                        Reset Password
                    </h2>

                    <p>
                        Reset your FinTrack account password
                    </p>

                </div>



                <!-- =================================================
                     RESET PASSWORD FORM
                     ================================================= -->

                <form id="forgotPasswordForm">


                    <!-- ================= USERNAME ================= -->

                    <div class="form-group">

                        <label for="resetUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="resetUsername"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>



                    <!-- ================= PHONE NUMBER ================= -->

                    <div class="form-group">

                        <label for="resetPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="resetPhone"
                            name="phone"
                            placeholder="Enter your registered phone number"
                            autocomplete="tel"
                            inputmode="numeric"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                        >

                    </div>



                    <!-- ================= NEW PASSWORD ================= -->

                    <div class="form-group">

                        <label for="resetPassword">
                            New Password
                        </label>


                        <div class="password-input">

                            <input
                                type="password"
                                id="resetPassword"
                                name="password"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                id="toggleResetPassword"
                                class="password-toggle"
                                aria-label="Show password">

                                👁

                            </button>

                        </div>



                        <!-- Password Requirements -->

                        <div class="password-requirements">

                            <p id="resetLengthRequirement">

                                <span>○</span>

                                At least 8 characters

                            </p>


                            <p id="resetUppercaseRequirement">

                                <span>○</span>

                                At least one uppercase letter

                            </p>


                            <p id="resetLowercaseRequirement">

                                <span>○</span>

                                At least one lowercase letter

                            </p>


                            <p id="resetNumberRequirement">

                                <span>○</span>

                                At least one number

                            </p>


                            <p id="resetSpecialRequirement">

                                <span>○</span>

                                At least one special character

                            </p>

                        </div>

                    </div>



                    <!-- ================= CONFIRM PASSWORD ================= -->

                    <div class="form-group">

                        <label for="resetConfirmPassword">
                            Confirm New Password
                        </label>


                        <div class="password-input">

                            <input
                                type="password"
                                id="resetConfirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                id="toggleResetConfirmPassword"
                                class="password-toggle"
                                aria-label="Show password">

                                👁

                            </button>

                        </div>

                    </div>



                    <!-- =================================================
                         RESET BUTTON
                         ================================================= -->

                    <button
                        type="submit"
                        class="login-btn">

                        Reset Password

                    </button>



                    <!-- =================================================
                         MESSAGE
                         ================================================= -->

                    <p
                        id="forgotPasswordMessage"
                        class="login-message">
                    </p>


                </form>



                <!-- =================================================
                     BACK TO LOGIN
                     ================================================= -->

                <div class="new-user">

                    <p>

                        Remember your password?

                        <a href="admin-login.html">
                            Back to Login
                        </a>

                    </p>

                </div>


            </div>

        </section>


    </main>



    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script src="script.js"></script>

<script src="frontend-security.js"></script>
</body>

</html>
