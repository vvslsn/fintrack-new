<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password - FinTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-brand"><div class="brand-content"><h1>Finance</h1></div></section>
    <section class="login-section"><div class="login-card">
      <div class="login-header"><h2>Reset Password</h2><p>We’ll email a one-time code to your registered address.</p></div>
      <form id="forgotPasswordForm">
        <div class="form-group"><label for="resetEmail">Registered email</label><input id="resetEmail" type="email" autocomplete="email" required placeholder="Enter your account email"></div>
        <button id="sendOtpButton" class="login-btn" type="submit">Email me a reset code</button>
      </form>
      <form id="resetPasswordForm" hidden>
        <div class="form-group"><label for="resetOtp">Six-digit code</label><input id="resetOtp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="Enter the code from your email"></div>
        <div class="form-group"><label for="resetPassword">New password</label><div class="password-input"><input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"><button class="password-toggle" type="button" aria-label="Show new password" aria-controls="resetPassword" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div></div>
        <div class="form-group"><label for="resetConfirmPassword">Confirm new password</label><div class="password-input"><input id="resetConfirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter your password"><button class="password-toggle" type="button" aria-label="Show confirm password" aria-controls="resetConfirmPassword" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div></div>
        <button id="resetSubmit" class="login-btn" type="submit">Reset password</button>
      </form>
      <p id="forgotPasswordMessage" class="login-message" role="status"></p>
      <div class="new-user"><p><a href="admin-login.html">Manager Login</a> · <a href="user/user-login.html">Member Login</a></p></div>
    </div></section>
  </main>
  <script src="api.js"></script>
  <script src="forgot.js"></script>
  <script src="frontend-security.js"></script>
</body>
</html>
