<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinTrack Manager Portal - Login</title>
  <link rel="stylesheet" href="user/user.css">
  <style>
    .manager-login-page .login-card { max-width: 500px; }
    .manager-login-page .manager-login-links { margin-top: 12px; font-size: 13px; }
    .manager-login-page .manager-login-links a { color: #3157d5; font-weight: 700; }
    .manager-login-page .manager-login-footer { margin-top: 22px; padding-top: 17px; border-top: 1px solid #e8ebf0; color: #7b8492; font-size: 12px; }
    .manager-login-page .manager-login-member-link { margin-top: 10px; font-size: 13px; }
    .manager-login-page .manager-login-footer a { color: #3157d5; font-weight: 700; }
    @media (max-width: 900px) { .manager-login-page .login-brand { min-height: 330px; } }
  </style>
</head>
<body>
  <main class="login-page manager-login-page">
    <section class="login-brand">
      <div class="login-brand-inner">
        <div class="brand"><span class="brand-mark">₹</span><span>FinTrack</span></div>
        <h1>Manager Portal</h1>
        <p>Manage your chit schemes, members, payments and account in one place.</p>
      </div>
    </section>
    <section class="login-card-wrap">
      <div class="login-card">
        <div class="eyebrow">FinTrack Manager Login</div>
        <h2>Welcome back</h2>
        <p class="sub">Sign in with your manager username or email and password.</p>
        <form id="loginForm">
          <div class="field">
            <label for="username">Username or email</label>
            <input id="username" name="username" type="text" autocomplete="username" required placeholder="Enter your username or email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-row">
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
              <button id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">👁</button>
            </div>
          </div>
          <p id="loginMessage" class="message" role="status"></p>
          <button class="btn" type="submit">Login to Manager Portal</button>
        </form>
        <p class="manager-login-links"><a href="forgot.html">Forgot password?</a> · <a href="privacy.html">Privacy Policy</a></p>
        <p class="manager-login-footer">New manager? <a href="signup.html">Create an account</a></p>
        <p class="manager-login-member-link"><a href="user/user-login.html">← Member Login</a></p>
      </div>
    </section>
  </main>
  <script src="api.js"></script>
  <script src="admin-login.js"></script>
  <script src="frontend-security.js"></script>
</body>
</html>
